}

*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tabon);outline-offset:2px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-inline:16px;max-width:760px;margin-inline:auto}

header.mast{background:var(--head);color:var(--head-ink);padding-block:14px 12px}
.mast .row1{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--tabon);color:var(--tabon-ink);display:grid;place-items:center}
.brand h1{font:700 1.5em/1 var(--display);letter-spacing:.04em;margin:0}
.brand p{margin:2px 0 0;font-size:.82em;opacity:.8}
.fsz{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:3px;border-radius:10px}
.fsz button{min-width:34px;height:30px;border-radius:8px;font-size:.85em;font-weight:600;color:var(--head-ink)}
.fsz button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.gsearch{position:relative;margin-top:12px}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7}
.gsearch input{width:100%;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--head-ink);padding:0 12px 0 38px}

.tabs .scroll{display:flex;gap:6px;overflow-x:auto;padding-inline:16px;scrollbar-width:none}
.tabs .scroll::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:8px 13px;border-radius:999px;color:var(--head-ink);font-weight:500;font-size:.92em;opacity:.88}
.tab[aria-selected="true"]{background:var(--tabon);color:var(--tabon-ink);opacity:1;font-weight:600}

.sub{color:var(--muted);font-size:.88em;margin:2px 0 0}

.cardh h3{font:700 1.05em/1.3 var(--display);margin:0}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:.84em}
.tag{display:inline-block;font-size:.72em;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;font-size:.8em;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.92em}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:.85em}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--surface2)}
.ib.on{color:var(--star)}
.ib.on svg{fill:currentColor}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9em}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.add{border-style:dashed;color:var(--accent)}

.field,.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label,.field label{font-size:.85em;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:42px}
textarea{resize:vertical;line-height:1.6}
.ck{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:500}
.ck input{width:20px;height:20px;accent-color:var(--accent)}

.acc{padding:0;overflow:hidden}
.acc>.head{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
.acc .num{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85em}
.acc .chev{transition:transform .18s;color:var(--muted)}
.acc[data-open="1"] .chev{transform:rotate(180deg)}
.acc .body{border-top:1px solid var(--line)}
.q{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .n{color:var(--muted);font-weight:600;min-width:1.6em}
.q .t{white-space:pre-wrap;overflow-wrap:anywhere}
.ans{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94em}
.qa{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:6px}

.item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .ttl{font-weight:500;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;margin-top:2px}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.late{color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 1.7em/1.2 var(--display);color:var(--accent)}
.stat span{color:var(--muted);font-size:.86em}
.hero{background:var(--head);color:var(--head-ink);border:0}
.hero .big{font:700 2.6em/1 var(--display);color:var(--tabon)}
.hero .btn{background:rgba(255,255,255,.12);border-color:transparent;color:var(--head-ink)}
.notice{background:var(--accent-soft);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:26px 14px}
.empty .btn{margin-top:10px}
.prow{padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pad textarea{min-height:170px}
.timer{font:700 1.6em/1 var(--display);font-variant-numeric:tabular-nums}
.thumb{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line)}
.qbox{padding:10px 12px;border-radius:10px;background:var(--surface2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94em}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow)}
#ov{position:fixed;inset:0;z-index:50;background:rgba(5,15,11,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h2{font:700 1.2em/1.3 var(--display);margin:0}
.sheet .btns{margin-top:6px}
.sheet .sp{flex:1}
@media (min-width:640px){#ov{align-items:center}.sheet{border-radius:20px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9em;max-width:90%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.v)return d}}catch(e){}return null}
var S=load()||seed();
['subjects','questions','syllabus','preli','extra','plan','bm','prac'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
S.settings=S.settings||{examName:'',examDate:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('এই ডিভাইসে সংরক্ষণ করা যায়নি। ছবি মুছে জায়গা খালি করুন।');return false}}
var hasSample=function(){return ['questions','syllabus','extra','plan'].some(function(k){return S[k].some(function(i){return i.s})})};

/* ---------- ui state ---------- */
var ui={tab:'dash',qsub:'all',qbcs:'all',qq:'',defOpen:true,open:{},ans:{},wsub:'bn',esub:'all',eq:'',pf:'all',gq:''};
var draft={qid:'',text:'',img:'',secs:0,run:false,t0:0};
var tick=null;
var subName=function(id){var s=S.subjects.filter(function(x){return x.id===id})[0];return s?s.name:''};
var subOpts=function(none){var o=S.subjects.map(function(s){return [s.id,s.name]});return none?[['','— নির্দিষ্ট নয় —']].concat(o):o};
var byId=function(arr,id){return S[arr].filter(function(x){return x.id===id})[0]};
var sampleTag=function(i){return i.s?'<span class="tag">নমুনা</span>':''};

/* ---------- views ---------- */
function empty(msg,btn){return '<div class="card empty"><div>'+msg+'</div>'+(btn||'')+'</div>'}
function addBtn(act,label){return '<button class="btn pri" data-act="'+act+'">'+ico('plus',16)+' '+label+'</button>'}
function chips(list,cur,act,addAct){
  return '<div class="chips" role="group">'+list.map(function(c){return '<button class="chip" data-act="'+act+'" data-v="'+esc(c[0])+'" aria-pressed="'+(c[0]===cur)+'">'+esc(c[1])+'</button>'}).join('')+(addAct?'<button class="chip add" data-act="'+addAct+'">+ বিষয়</button>':'')+'</div>';
}

function vDash(){
  var ex=S.settings,cd='';
  if(ex.examDate){
    var diff=Math.round((new Date(ex.examDate+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
    cd=diff>0?'<div class="big">'+bn(diff)+'</div><div>দিন বাকি</div>':diff===0?'<div class="big">আজ</div><div>পরীক্ষার দিন</div>':'<div>পরীক্ষার তারিখ পেরিয়ে গেছে</div>';
  } else cd='<div>পরীক্ষার তারিখ এখনো দেওয়া হয়নি</div>';
  var sT=S.syllabus.length,sD=S.syllabus.filter(function(x){return x.done}).length,pT=S.plan.length,pD=S.plan.filter(function(x){return x.done}).length;
  var pc=sT?Math.round(sD*100/sT):0;
  var bmN=S.questions.filter(function(x){return x.star}).length+S.extra.filter(function(x){return x.star}).length+S.bm.length;
  var t=today();
  var due=S.plan.filter(function(x){return !x.done&&x.date&&x.date<=t}).sort(function(a,b){return a.date<b.date?-1:1});
  var upc=S.plan.filter(function(x){return !x.done&&(!x.date||x.date>t)}).sort(function(a,b){return (a.date||'9')<(b.date||'9')?-1:1}).slice(0,3);
  var tasks=due.concat(upc).slice(0,6);
  var rows=S.subjects.map(function(s){
    var a=S.syllabus.filter(function(x){return x.subj===s.id}),d=a.filter(function(x){return x.done}).length;

    return '<div style="margin-top:10px"><div class="cardh"><span>'+esc(s.name)+'</span><span class="meta">'+bn(d)+'/'+bn(a.length)+'</span></div><div class="bar" style="margin-top:4px"><i style="width:'+Math.round(d*100/a.length)+'%"></i></div></div>';
  }).join('');
  return ''
  +(hasSample()?'<div class="card notice"><div class="cardh"><div class="grow"><b>এখানকার কিছু তথ্য নমুনা</b><div class="meta">নিজের তথ্য যোগ করুন, তারপর নমুনাগুলো মুছে দিন।</div></div><button class="btn sm warm" data-act="clearsample">নমুনা মুছুন</button></div></div>':'')
  +'<div class="card hero"><div class="cardh"><div><div class="meta" style="color:inherit;opacity:.8">'+esc(ex.examName||'পরীক্ষা')+'</div>'+cd+'</div><button class="btn sm" data-act="setexam">'+ico('edit',15)+' তারিখ দিন</button></div></div>'
  +'<div class="stats">'
  +'<button class="stat" data-act="tab" data-v="qb"><b>'+bn(S.questions.length)+'</b><span>লিখিত প্রশ্ন</span></button>'
  +'<button class="stat" data-act="tab" data-v="wsyl"><b>'+bn(pc)+'%</b><span>সিলেবাস শেষ ('+bn(sD)+'/'+bn(sT)+')</span></button>'
  +'<button class="stat" data-act="tab" data-v="plan"><b>'+bn(pD)+'/'+bn(pT)+'</b><span>স্টাডি প্ল্যানের কাজ</span></button>'
  +'<button class="stat" data-act="tab" data-v="bm"><b>'+bn(bmN)+'</b><span>সংরক্ষিত</span></button>'
  +'</div>'
  +'<div class="card"><div class="cardh"><h3>দ্রুত যোগ করুন</h3></div><div class="btns" style="margin-top:10px">'
  +'<button class="btn" data-act="addq">'+ico('book',16)+' প্রশ্ন</button><button class="btn" data-act="addsyl">'+ico('check',16)+' সিলেবাস টপিক</button>'
  +'<button class="btn" data-act="addpreli">'+ico('layers',16)+' প্রিলি বিষয়</button><button class="btn" data-act="addnote">'+ico('grid',16)+' অতিরিক্ত নোট</button>'
  +'<button class="btn" data-act="addtask">'+ico('cal',16)+' কাজ</button><button class="btn" data-act="addbm">'+ico('bm',16)+' বুকমার্ক</button></div></div>'
  +'<div class="card acc"><div class="cardh" style="padding:14px 14px 6px"><h3>করণীয়</h3><button class="btn sm" data-act="tab" data-v="plan">সব দেখুন</button></div>'
  +(tasks.length?tasks.map(planRow).join(''):'<div class="empty">কোনো অসম্পন্ন কাজ নেই।</div>')+'</div>'
  +(rows?'<div class="card"><div class="cardh"><h3>বিষয়ভিত্তিক সিলেবাস অগ্রগতি</h3></div>'+rows+'</div>':'')
  +'<div class="card"><div class="cardh"><h3>ডাটা ব্যাকআপ</h3></div><p class="meta" style="margin:4px 0 10px">তথ্য এই ডিভাইসের ব্রাউজারে জমা থাকে। অন্য ডিভাইসে নিতে কপি করে সেখানে আমদানি করুন (প্র্যাকটিসের ছবি বাদ যায়)।</p><div class="btns"><button class="btn" data-act="copy">ডাটা কপি করুন</button><button class="btn" data-act="import">ডাটা আমদানি</button></div></div>';
}

function qList(){
  var q=ui.qq.trim().toLowerCase();
  var qs=S.questions.filter(function(x){
    return (ui.qsub==='all'||x.subj===ui.qsub)&&(ui.qbcs==='all'||String(x.bcs)===ui.qbcs)&&(!q||(x.text+' '+x.ans).toLowerCase().indexOf(q)>-1);
  });
  if(!qs.length)return empty('কোনো প্রশ্ন পাওয়া যায়নি।',addBtn('addq','প্রশ্ন যোগ করুন'));
  var groups={};qs.forEach(function(x){var k=x.bcs||0;(groups[k]=groups[k]||[]).push(x)});
  var keys=Object.keys(groups).map(Number).sort(function(a,b){return b-a});
  return keys.map(function(k,i){
    var g=groups[k],open=ui.open[k]!==undefined?ui.open[k]:ui.defOpen;
    var title=k?bn(k)+'তম বিসিএস (লিখিত)':'বিসিএস নম্বর ছাড়া';
    return '<div class="card acc" data-open="'+(open?1:0)+'"><button class="head" data-act="tog" data-v="'+k+'" aria-expanded="'+open+'"><span class="num">'+bn(i+1)+'</span><span class="grow"><b>'+title+'</b><div class="meta">মোট প্রশ্ন: '+bn(g.length)+' টি</div></span><span class="chev">'+ico('chev')+'</span></button>'
    +(open?'<div class="body">'+g.map(function(x,j){
      return '<div class="q"><span class="n">'+bn(j+1)+'.</span><div class="grow"><div class="t">'+esc(x.text)+'</div>'
      +'<div class="meta" style="margin-top:4px"><span class="pill">'+esc(subName(x.subj)||'বিষয় নেই')+'</span>'+(x.marks!==''&&x.marks!=null?' · মান '+bn(x.marks):'')+sampleTag(x)+'</div>'
      +(ui.ans[x.id]?'<div class="ans">'+(x.ans?esc(x.ans):'কোনো উত্তর বা নোট যোগ করা হয়নি।')+'</div>':'')
      +'<div class="qa"><button class="btn sm" data-act="ans" data-id="'+x.id+'">'+(ui.ans[x.id]?'উত্তর লুকান':'উত্তর / নোট')+'</button>'
      +'<button class="ib'+(x.star?' on':'')+'" data-act="star" data-k="questions" data-id="'+x.id+'" aria-label="বুকমার্ক" aria-pressed="'+(!!x.star)+'">'+ico('star')+'</button>'
      +'<button class="ib" data-act="prq" data-id="'+x.id+'" aria-label="লিখে অনুশীলন করুন">'+ico('pen')+'</button>'
      +'<button class="ib" data-act="editq" data-id="'+x.id+'" aria-label="সম্পাদনা">'+ico('edit')+'</button></div></div></div>';
    }).join('')+'</div>':'')+'</div>';
  }).join('');
}

function vSearch(){
  var q=ui.gq.trim().toLowerCase(),out='<div><h2 class="sec">খোঁজার ফল</h2><p class="sub">“'+esc(ui.gq)+'”</p></div>',n=0;
  function sec(title,tab,items){if(!items.length)return;n+=items.length;out+='<div class="card acc"><div class="cardh" style="padding:14px 14px 6px"><h3>'+title+'</h3></div>'+items.map(function(t){return '<button class="item" style="width:100%;text-align:left" data-act="tab" data-v="'+tab+'"><div class="grow"><div class="ttl">'+esc(t[0])+'</div><div class="meta">'+esc(t[1]||'')+'</div></div></button>'}).join('')+'</div>'}
  var m=function(s){return String(s||'').toLowerCase().indexOf(q)>-1};
  sec('লিখিত প্রশ্ন','qb',S.questions.filter(function(x){return m(x.text)||m(x.ans)}).map(function(x){return [x.text,subName(x.subj)]}));
  sec('লিখিত সিলেবাস','wsyl',S.syllabus.filter(function(x){return m(x.title)}).map(function(x){return [x.title,subName(x.subj)]}));
  sec('প্রিলি বিষয়','psyl',S.preli.filter(function(x){return m(x.subj)||m(x.topics)}).map(function(x){return [x.subj,bn(x.marks||0)+' নম্বর']}));
  sec('অতিরিক্ত টপিকস','extra',S.extra.filter(function(x){return m(x.title)||m(x.body)}).map(function(x){return [x.title,x.body.slice(0,80)]}));

  sec('বুকমার্ক','bm',S.bm.filter(function(x){return m(x.title)||m(x.note)}).map(function(x){return [x.title,x.note]}));
  if(!n)out+=empty('কিছু পাওয়া যায়নি।');

/* ---------- render ---------- */
function render(){
  if(tick){clearInterval(tick);tick=null}
  if(ui.tab!=='prac')draft.run=false;
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(t[0]===ui.tab&&!ui.gq)+'">'+ico(t[2],16)+'<span>'+t[1]+'</span></button>'}).join('');
  var v={dash:vDash,qb:vQB,wsyl:vWSyl,psyl:vPSyl,extra:vExtra,plan:vPlan,bm:vBM,prac:vPrac}[ui.tab];
  $('#main').innerHTML=ui.gq?vSearch():v();
  var f=$('#fab'),lbl=FAB[ui.tab];
  f.hidden=!lbl||!!ui.gq;
  if(lbl)f.innerHTML=ico('plus',20)+'<span>'+lbl+'</span>';
  if(ui.tab==='prac'&&draft.run&&!ui.gq)startTick();
}
function startTick(){
  draft.t0=Date.now()-draft.secs*1000;
  tick=setInterval(function(){draft.secs=Math.floor((Date.now()-draft.t0)/1000);var e=$('#pt');if(e)e.textContent=fmt(draft.secs)},500);
}
function go(tab){ui.tab=tab;ui.gq='';$('#gs').value='';render();window.scrollTo(0,0)}

/* ---------- modal form ---------- */
var cfg=null,delArmed=false;
function fld(f,v){
  var id='f_'+f.k,val=v[f.k]==null?'':v[f.k],c;
  if(f.t==='check')return '<label class="ck"><input id="'+id+'" type="checkbox"'+(val?' checked':'')+'><span>'+f.l+'</span></label>';
  if(f.t==='textarea')c='<textarea id="'+id+'" rows="'+(f.rows||4)+'"'+(f.req?' required':'')+'>'+esc(val)+'</textarea>';
  else if(f.t==='select')c='<select id="'+id+'">'+f.o.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  else c='<input id="'+id+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.req?' required':'')+(f.t==='number'?' inputmode="numeric" min="0"':'')+'>';
  return '<div class="fld"><label for="'+id+'">'+f.l+(f.req?' *':'')+'</label>'+c+'</div>';
}
function openForm(c){
  cfg=c;delArmed=false;
  $('#mt').textContent=c.title;
  $('#mf').innerHTML=c.fields.map(function(f){return fld(f,c.values||{})}).join('')
   +'<div class="btns">'+(c.onDelete?'<button type="button" class="btn warm" data-act="mdel">'+ico('trash',16)+' মুছুন</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-act="mclose">বাতিল</button><button type="submit" class="btn pri">সংরক্ষণ</button></div>';
  $('#ov').hidden=false;
  var first=$('#mf input:not([type=checkbox]),#mf textarea,#mf select');if(first&&!c.noFocus)setTimeout(function(){first.focus()},30);
}
function openInfo(title,html){cfg=null;$('#mt').textContent=title;$('#mf').innerHTML=html;$('#ov').hidden=false}
function closeForm(){$('#ov').hidden=true;cfg=null}
$('#mf').addEventListener('submit',function(e){
  e.preventDefault();if(!cfg||!cfg.onSave)return;
  var vals={};cfg.fields.forEach(function(f){var el=$('#f_'+f.k);vals[f.k]=f.t==='check'?el.checked:f.t==='number'?(el.value===''?'':Number(el.value)):el.value.trim()});
  cfg.onSave(vals);save();closeForm();render();
});
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}

function crud(arr,title,fields,defaults,opts){
  return function(id){
    var it=id?byId(arr,id):null,vals=it?Object.assign({},it):Object.assign({},defaults||{});
    openForm({title:(it?title+' সম্পাদনা':title+' যোগ'),fields:fields,values:vals,
      onSave:function(v){if(it){Object.assign(it,v);delete it.s}else S[arr].push(Object.assign({id:uid()},v,opts&&opts.extra?opts.extra:{}))},
      onDelete:it?function(){S[arr]=S[arr].filter(function(x){return x.id!==id})}:null});
  };
}

/* ---------- practice helpers ---------- */
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,v=t.dataset.v,it;
  switch(a){
    case 'tab':go(v);break;
    case 'fab':if(ADD[ui.tab])ADD[ui.tab]();break;
    case 'fs':document.body.style.setProperty('--fs',v);document.querySelectorAll('.fsz button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});try{localStorage.setItem('bcsp-fs',v)}catch(x){}break;
    case 'mclose':closeForm();break;
    case 'mdel':if(!delArmed){delArmed=true;t.innerHTML=ico('trash',16)+' নিশ্চিত করুন — মুছুন'}else{var d=cfg&&cfg.onDelete;if(d){d();save();closeForm();render()}}break;
    case 'qsub':ui.qsub=v;render();break;
    case 'qbcs':ui.qbcs=v;render();break;
    case 'wsub':ui.wsub=v;render();break;
    case 'esub':ui.esub=v;render();break;
    case 'pf':ui.pf=v;render();break;
    case 'tog':var cur=ui.open[v]!==undefined?ui.open[v]:ui.defOpen;ui.open[v]=!cur;render();break;
    case 'expall':ui.defOpen=true;ui.open={};render();break;
    case 'colall':ui.defOpen=false;ui.open={};render();break;
    case 'ans':ui.ans[id]=!ui.ans[id];render();break;
    case 'star':it=byId(t.dataset.k,id);if(it){it.star=it.star?0:1;save();render()}break;
    case 'sylchk':it=byId('syllabus',id);if(it){it.done=it.done?0:1;save();render()}break;
    case 'planchk':it=byId('plan',id);if(it){it.done=it.done?0:1;save();render()}break;
    case 'addq':F.q();break; case 'editq':F.q(id);break;
    case 'addsyl':F.syl();break; case 'editsyl':F.syl(id);break;
    case 'addpreli':F.preli();break; case 'editpreli':F.preli(id);break;
    case 'addnote':F.note();break; case 'editnote':F.note(id);break;
    case 'addtask':F.task();break; case 'edittask':F.task(id);break;
    case 'addbm':F.bm();break; case 'editbm':F.bm(id);break;
    case 'editprac':F.prac(id);break;
    case 'addsubj':F.subj();break;
    case 'setexam':F.exam();break;
    case 'prq':draft.qid=id;go('prac');break;
    case 'ptoggle':draft.run=!draft.run;render();break;
    case 'preset':draft.run=false;draft.secs=0;render();break;
    case 'pimgrm':draft.img='';render();break;
    case 'psave':
      if(!draft.text.trim()&&!draft.img){toast('উত্তর লিখুন অথবা ছবি যোগ করুন');break}
      var q=draft.qid?byId('questions',draft.qid):null;
      S.prac.push({id:uid(),title:q?q.text.slice(0,70):(draft.text.trim().slice(0,40)||'ছবির উত্তর'),text:draft.text,img:draft.img,secs:draft.secs,date:today()});
      if(save()){draft={qid:'',text:'',img:'',secs:0,run:false,t0:0};toast('সেশন সংরক্ষিত হয়েছে');render()}else S.prac.pop();
      break;
    case 'zoom':it=byId('prac',id);if(it)openInfo('হাতের লেখা','<img class="thumb" style="max-height:none;width:100%" src="'+it.img+'" alt="হাতের লেখার ছবি">');break;
    case 'clearsample':
      ['questions','syllabus','extra','plan'].forEach(function(k){S[k]=S[k].filter(function(x){return !x.s})});save();render();toast('নমুনা তথ্য মুছে ফেলা হয়েছে');break;
    case 'copy':
      var copy=JSON.parse(JSON.stringify(S));copy.prac.forEach(function(p){p.img=''});var txt=JSON.stringify(copy);
      var show=function(){openInfo('ডাটা কপি','<div class="fld"><label for="bk">নিচের লেখাটি সব নির্বাচন করে কপি করুন</label><textarea id="bk" rows="8" readonly>'+esc(txt)+'</textarea></div>');setTimeout(function(){var b=$('#bk');if(b){b.focus();b.select()}},30)};
      try{navigator.clipboard.writeText(txt).then(function(){toast('ডাটা কপি হয়েছে')},show)}catch(x){show()}
      break;
    case 'import':
      openForm({title:'ডাটা আমদানি',fields:[{k:'raw',l:'কপি করা ডাটা এখানে পেস্ট করুন (বর্তমান ডাটা বদলে যাবে)',t:'textarea',rows:7,req:1}],values:{},noFocus:0,
        onSave:function(v){try{var d=JSON.parse(v.raw);if(!d||!d.v||!Array.isArray(d.questions))throw 0;S=d;['subjects','questions','syllabus','preli','extra','plan','bm','prac'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});S.settings=S.settings||{};toast('আমদানি সম্পন্ন')}catch(x){toast('ডাটা সঠিক নয়')}}});
      break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='gs'){ui.gq=e.target.value;render()}
  else if(id==='qs'){ui.qq=e.target.value;$('#qlist').innerHTML=qList()}
  else if(id==='es'){ui.eq=e.target.value;$('#elist').innerHTML=eList()}
  else if(id==='pd-text'){draft.text=e.target.value}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='pd-q'){draft.qid=e.target.value;render()}
  else if(id==='pi-cam'||id==='pi-gal'){var f=e.target.files&&e.target.files[0];if(f)shrink(f).then(function(d){draft.img=d;render()},function(){toast('ছবি পড়া যায়নি')})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#ov').hidden)closeForm()});
